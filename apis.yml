aid: brelyon
name: Brelyon
description: 'Brelyon is an MIT Media Lab spin-off building headset-free virtual displays
  — desktop monitors that use electro-optics and computational rendering to produce
  monocular image depth rather than autostereoscopic 3D. Its Ultra Reality line delivers
  a 122-inch virtual screen filling roughly 110 degrees of field of view, alongside
  Ultra Reality Extend (a multi-focal monitor that renders AI-generated overlays at
  different depths), Ultra Reality Mini, and experimental Hyper Displays. The company
  is headquartered in San Mateo, California with an international office in Taichung,
  Taiwan, and sells into enterprise simulation, training, teleoperation and medical
  visualization; prosumer flight simulation, gaming, trading and content production;
  and automotive in-vehicle HMI integration. Brelyon ships desktop software (Brelyon
  Suite, Focal Studio, Visual Engine, Stream Weaver) for distortion correction, monitor
  merging and multi-focal content creation, but publishes no public developer program,
  API, or SDK.'
